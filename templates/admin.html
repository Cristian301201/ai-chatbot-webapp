<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Control - Ducati Leads</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body { background-color: #f8f9fa; }
        .navbar { background-color: #ce1d1d; } 
        .container { margin-top: 50px; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark shadow">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">Ducati Colombia - Base de Datos</span>
        </div>
    </nav>

    <div class="container">
        <div class="card shadow">
            <div class="card-header bg-white">
                <h4 class="mb-0">Clientes Interesados</h4>
            </div>
            <div class="card-body">
                <table class="table table-hover">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Fecha</th>
                            <th>Nombre</th>
                            <th>Email</th>
                            <th>Teléfono</th>
                            <th>Interés</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for lead in leads %}
                        <tr>
                            <td>{{ lead.id }}</td>
                            <td>{{ lead.fecha }}</td>
                            <td><strong>{{ lead.nombre }}</strong></td>
                            <td>{{ lead.email }}</td>
                            <td>{{ lead.telefono }}</td>
                            <td><span class="badge bg-danger">{{ lead.interes }}</span></td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
